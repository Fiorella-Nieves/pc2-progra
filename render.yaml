services:
  - type: web
    name: portal-inmobiliario
    env: dotnet
    plan: free
    branch: main
    buildCommand: dotnet publish -c Release -o ./publish
    startCommand: cd ./publish && dotnet PortalInmobiliario.dll
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:${PORT}
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: portal-inmobiliario-db
          property: connectionString
      - key: Redis__ConnectionString
        fromService:
          name: portal-inmobiliario-redis
          type: redis
          property: connectionString

databases:
  - name: portal-inmobiliario-db
    plan: free
    databaseName: portalinmobiliario
    user: portaluser

redis:
  - name: portal-inmobiliario-redis
    plan: free
    ipAllowList: []